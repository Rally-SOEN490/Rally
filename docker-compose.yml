# Local PostgreSQL for development and tests. Start it with `docker compose up -d`.
# These credentials are for your own computer only. Never reuse them on a server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate rally_test database the API tests use.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rally"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
