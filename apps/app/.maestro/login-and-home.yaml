# AI declaration:
# 50% or more AI-generated

appId: com.rally.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://"
      - eraseText: 100
      - inputText: "http://10.0.2.2:8081"
      - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn:
                point: "92%,13%"

- extendedWaitUntil:
    visible: "Log in"
    timeout: 15000
- tapOn: "E-mail address"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
