name: User story
description: Plan a user-facing change for SOEN 490
title: "[Story] "
type: User story
body:
  - type: markdown
    attributes:
      value: |
        Attach this story as a sub-issue of its feature epic and add its feature label. Set Story points and Priority in the issue fields. Add a milestone when the story is planned for an iteration. Keep small implementation steps as checkboxes below. A larger step may become a Task sub-issue of this story.
  - type: textarea
    id: story
    attributes:
      label: User story
      description: State the actor, goal, and outcome.
      placeholder: As a player, I want to see my next match, so I can arrive at the right court on time.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions the stakeholder can review.
      placeholder: |
        - [ ] The player can see the court and start time for each upcoming match.
        - [ ] The schedule reflects organizer changes.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: What could prevent this story from working or being delivered? Include impact and how the team will check it.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Task plan
      description: List the related tasks as checkboxes. If a larger task becomes a Task sub-issue, replace its checklist line with the issue link.
      placeholder: |
        - [ ] Validate the match data
        - [ ] Show the match in the schedule
        - [ ] Add unit tests for schedule changes
        - #123
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related references
      description: Link architecture diagrams, discussion notes, and pull requests that affect this story but do not close it. Pull requests that close this story appear under Development automatically.
      placeholder: |
        Architecture or discussion notes:
        Related pull requests:
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        When the stakeholder signs off, record it in a comment on this issue.
  - type: textarea
    id: ai
    attributes:
      label: AI-use acknowledgment
      description: Name the AI tool and what it contributed, or write None.
    validations:
      required: true
