# AI contribution: 50% or more AI-generated

# Weekly version updates for the app and API npm dependencies and the GitHub
# Actions used by the workflows, combined into one pull request. Major
# versions are skipped and upgraded by hand as their own tasks. Dependabot pull
# requests are exempt from the branch name and PR title check (see
# .github/workflows/branch-pr-naming.yml).
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      timezone: America/Toronto

updates:
  - package-ecosystem: npm
    directory: /apps/app
    multi-ecosystem-group: weekly
    patterns: ["*"]
    # The Expo SDK pins the versions of these packages, and Dependabot does not
    # know about the SDK, so it would propose versions that do not match it.
    # Ignoring them (rather than grouping them) is the only way to stop that:
    # a group still bumps exact pins such as react-native 0.86.3. Keep them in
    # line with `npx expo install --check` and `npx expo install --fix`, and
    # move to a new SDK with `npx expo install expo@^<version> --fix`.
    # The list matches node_modules/expo/bundledNativeModules.json, plus jest,
    # typescript and their type packages, which `expo install --check` also
    # validates. When you add a package with `npx expo install`, add it here if
    # the SDK pins it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: jest-expo
      - dependency-name: eslint-config-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-web
      - dependency-name: react-native-worklets
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: jest
      - dependency-name: "@types/jest"
      - dependency-name: "@types/react"
      - dependency-name: typescript

  - package-ecosystem: npm
    directory: /apps/api
    multi-ecosystem-group: weekly
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
