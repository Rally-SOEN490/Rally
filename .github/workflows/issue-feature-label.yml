name: Apply issue feature label

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Apply selected feature label
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const currentLabels = new Set(issue.labels.map(label => label.name));
            if (!currentLabels.has('epic') && !currentLabels.has('user story')) return;

            const features = [
              'Accounts', 'PlayerProfile', 'PlayerStats', 'Teams',
              'Tournaments', 'Brackets', 'Results', 'Discovery',
              'Notifications', 'AIAssistant', 'Platform',
            ];
            const match = (issue.body || '').match(/^### Feature label\r?\n(?:\r?\n)*([^\r\n]+)/m);
            const selected = match?.[1].trim();
            if (!features.includes(selected)) {
              core.warning(`No valid feature selection found on issue #${issue.number}`);
              return;
            }

            const target = { ...context.repo, issue_number: issue.number };
            if (!currentLabels.has(selected)) {
              await github.rest.issues.addLabels({ ...target, labels: [selected] });
            }
            for (const feature of features) {
              if (feature !== selected && currentLabels.has(feature)) {
                await github.rest.issues.removeLabel({ ...target, name: feature });
              }
            }
