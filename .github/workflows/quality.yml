name: Code quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-format:
    name: Lint and format (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [app, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  web-build:
    name: App web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build app for web
        env:
          # Static rendering initializes Firebase. These dummy values need no
          # secrets or live services, so fork PRs can run this build too.
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: rally-ci.invalid
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: rally-ci
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: rally-ci.invalid
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          EXPO_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: npm run build:web

  e2e:
    name: Android E2E
    # Repository secrets are unavailable to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rally -d rally"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/app/package-lock.json
            apps/api/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Check E2E secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          MAESTRO_EMAIL_BASE: ${{ secrets.MAESTRO_EMAIL_BASE }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing EXPO_PUBLIC_FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$MAESTRO_EMAIL_BASE" || { echo "Missing MAESTRO_EMAIL_BASE"; exit 1; }
          test -n "$MAESTRO_TEST_PASSWORD" || { echo "Missing MAESTRO_TEST_PASSWORD"; exit 1; }

      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ******localhost:5432/rally
        run: npm run db:deploy

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: ******localhost:5432/rally
          FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          CORS_ORIGINS: http://10.0.2.2:8081
        run: |
          npm start > "$RUNNER_TEMP/rally-api.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/rally-api.log"
          exit 1

      - name: Install app dependencies
        working-directory: apps/app
        run: npm ci

      - name: Configure CI app
        working-directory: apps/app
        env:
          FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          MAESTRO_EMAIL_BASE: ${{ secrets.MAESTRO_EMAIL_BASE }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
        run: |
          cat > .env.local <<EOF
          EXPO_PUBLIC_API_URL=http://10.0.2.2:3000
          EXPO_PUBLIC_FIREBASE_API_KEY=$FIREBASE_API_KEY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          EXPO_PUBLIC_FIREBASE_APP_ID=$FIREBASE_APP_ID
          MAESTRO_EMAIL_BASE=$MAESTRO_EMAIL_BASE
          MAESTRO_TEST_PASSWORD=$MAESTRO_TEST_PASSWORD
          EOF
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Run Maestro E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_EMAIL_BASE: ${{ secrets.MAESTRO_EMAIL_BASE }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r apps/app/android/app/build/outputs/apk/debug/app-debug.apk
            npm --prefix apps/app exec -- expo start --dev-client --localhost > "$RUNNER_TEMP/expo.log" 2>&1 &
            curl -Ls https://get.maestro.mobile.dev | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            cd apps/app
            pwsh -File .maestro/run-account-e2e.ps1
