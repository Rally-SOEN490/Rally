name: API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rally"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The tests only use TEST_DATABASE_URL. DATABASE_URL just has to be different.
      DATABASE_URL: postgresql://rally:rally@localhost:5432/rally
      TEST_DATABASE_URL: postgresql://rally:rally@localhost:5432/rally_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
