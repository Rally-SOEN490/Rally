name: Pull request check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check linked issue and AI acknowledgment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const problems = [];

            const link = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|part of)\s+#(\d+)/i);
            if (!link) problems.push('Link the issue with "Closes #<number>", or "Part of #<number>" for partial work.');

            const ai = body.match(/^## AI-use acknowledgment\s*\n([\s\S]*?)(?=^## |$(?![\s\S]))/m);
            if (!ai || !ai[1].trim()) problems.push('Fill in the AI-use acknowledgment. Write None if no AI tool contributed.');

            if (problems.length) {
              core.setFailed(problems.join('\n'));
              return;
            }

            const target = { ...context.repo, issue_number: pr.number };
            let issue;
            try {
              ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(link[1]) }));
            } catch {
              core.setFailed(`Issue #${link[1]} was not found.`);
              return;
            }
            if (issue.pull_request) {
              core.setFailed(`#${link[1]} is a pull request. Link an issue instead.`);
              return;
            }

            const labels = issue.labels.map(label => label.name).filter(name => !pr.labels.some(l => l.name === name));
            if (labels.length) await github.rest.issues.addLabels({ ...target, labels });
            if (issue.milestone && !pr.milestone) {
              await github.rest.issues.update({ ...target, milestone: issue.milestone.number });
            }
            if (!pr.assignees.length) {
              await github.rest.issues.addAssignees({ ...target, assignees: [pr.user.login] });
            }
